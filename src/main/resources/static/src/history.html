<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/output.css" rel="stylesheet">
    <link href="/src/css/sidebar.css" rel="stylesheet">
    <link href="/src/css/history.css" rel="stylesheet">
    <link href="/src/css/downloadBtn.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Pocket-Dex</title>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script> -->
</head>
<body>
    <div class="sidebar w-56 h-full flex flex-col fixed justify-between font-sans text-gray-300 text-base p-6">
        <div class="sidebar-top">
            <div class="s-top-logo"><div class="sidebar-header flex items-center gap-1 mb-8 rounded-full py-4 text-2xl font-semibold"><i class="fa-solid fa-prescription fa-lg"></i>Pocket-Dex</div></div>
            <div class="home px-2 py-2 mb-4 inline-flex items-center gap-2 font-semibold hover:text-gray-800 hover:font-bold ease-in-out duration-300"><i class="fa-solid fa-house fa-lg"></i><a href="/src/about.html">Home</a></div>
            <div class="Dashboard px-2 py-2 mb-4 inline-flex items-center gap-2 font-semibold hover:text-gray-800 hover:font-bold ease-in-out duration-300"><i class="fa-solid fa-layer-group fa-lg"></i> <a href="/src/dashboard.html">Dashboard</a></div>
            <div class="wallet px-2 mb-4 py-2 inline-flex items-center gap-2 font-semibold hover:text-gray-800 hover:font-bold ease-in-out duration-300"><i class="fa-solid fa-wallet fa-lg"></i>Wallet</div>
            <div class="history px-2 mb-4 py-2 inline-flex items-center gap-2 font-semibold hover:text-gray-800 hover:font-bold ease-in-out duration-300"><i class="fa-solid fa-clock-rotate-left fa-lg"></i> <a href="/src/history.html">History</a></div>
            <div class="profile px-2 mb-4 py-2 inline-flex items-center gap-2 font-semibold hover:text-gray-800 hover:font-bold ease-in-out duration-300"><i class="fa-solid fa-user fa-lg"></i>Profile</div>
        </div>
        <div class="sidebar-bottom border-t-2 py-4">
            <div class="settings px-2 mb-4 py-2 inline-flex items-center gap-2 font-semibold hover:text-gray-800 hover:font-bold ease-in-out duration-300"><i class="fa-solid fa-gear fa-lg"></i><a href="/src/settings.html">Settings</div>
            <div class="logout px-2 mb-4 py-2 inline-flex items-center gap-2 font-semibold hover:text-gray-800 hover:font-bold ease-in-out duration-300"><i class="fa-solid fa-arrow-right-from-bracket fa-lg"></i><a href="/login">Logout</a></div>
        </div>
    </div>

    <div class="main px-8 pt-6 flex flex-col gap-4 h-screen">
        <div class="main-header flex justify-between ">
            <div class="m-header-l">
                <div class="m-h-l-searchbar pl-6 pr-72 py-2 rounded-2xl text-gray-300">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Search
                </div>
            </div>
            <div class="m-header-r pr-14 text-gray-300 flex gap-5 items-center">
                <div class="user-greet text-gray-300 font-semibold text-xl">
                    Hello, User
                </div>
                <i class="fa-solid fa-bell fa-rotate-by fa-xl" style="--fa-rotate-angle: 40deg;"></i>
            </div>
        </div>

        

        <div class="main-date text-gray-300 font-semibold text-lg px-2 flex gap-2 items-center my-2">
            <i class="fa-solid fa-calendar-days"></i> 
            <div class="main-date-text">2024-25-02</div>
        </div>

        <div class="main-history-container p-3 rounded-xl flex flex-col gap-5 overflow-auto mb-7">
            <div class="m-h-c-header flex justify-between p-2">
                <!-- <div class="m-h-c-header-left pl-6 pr-56 py-1 rounded-2xl text-gray-300 ml-28">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Search
                </div> -->

                <div id="wrap">
                    <a href="#" class="btn-slide pdf-btn">
                      <span class="circle"><i class="fa-solid fa-file-pdf"></i></span>
                      <span class="title">PDF</span>
                      <span class="title-hover">Click here</span>
                    </a>
                    <a href="#" class="btn-slide2 excel-btn">
                      <span class="circle2"><i class="fa-solid fa-file-excel"></i></span>
                      <span class="title2">Excel</span>
                      <span class="title-hover2">Click here</span>
                    </a>
                </div>

                <div class="m-h-c-header-right flex gap-4 items-center">
                    <div class="header-from flex gap-2 items-center">
                        <div class="header-from-text text-gray-400 font-medium">From</div>
                        <input class="header-from-date py-1 px-3 rounded-2xl text-gray-300 font-semibold" type="date"></input>
                    </div>
                    <div class="header-to flex gap-2 items-center">
                        <div class="header-to-text text-gray-400 font-medium">To</div>
                        <input class="header-to-date py-1 px-3 rounded-2xl text-gray-300 font-semibold" type="date"></input>
                    </div>
                    <i class="sort-search-button fa-solid fa-magnifying-glass text-gray-400 font-bold text-xl"></i>
                </div>
            </div>
            <!-- history-sort -->
            <!-- <div class="m-h-c-sort flex justify-end gap-5 px-2">
                <div class="m-h-c-all text-gray-500">all</div>
                <div class="m-h-c-recent text-gray-500">recent</div>
                <div class="m-h-c-largest text-gray-300 font-semibold">largest</div>
            </div> -->

            <!-- history-list -->
            <div class="history-list">
                <!-- list headings -->
                <div class="history-list-headings flex text-gray-400 pl-6 justify-between">
                    <div class="history-headings-icon"><i class="fa-solid fa-ellipsis-vertical fa-lg"></i></div>
                    <div class="history-headings-date w-28 ">Date</div>
                    <div class="history-headings-name w-28 ">Name</div>
                    <div class="history-headings-wallet w-28 "> Wallet</div>
                    <div class="history-headings-amount w-28 ">Amount</div>
                    <div class="history-headings-status w-28">Category</div>
                </div>
                <!-- list entries -->
                <div class="history-list-entries flex flex-col gap-4 px-2 py-3 ease-in-out duration-300">
                  

                  
                </div>
            </div>
        </div>

    </div>
    
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.0/xlsx.full.min.js"></script>
<script src="https://unpkg.com/pdf-lib"></script>
<script src="https://kit.fontawesome.com/0010a0ae9f.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.0/xlsx.full.min.js"></script>
<script src="/src/js/history.js"></script>
<script src="/src/js/historyDownload.js"></script>
</html>
